# Test configuration - uses embedded MongoDB for @DataMongoTest
spring.data.mongodb.uri=mongodb://localhost:27017/smart_campus_test_db

# JWT test config
app.jwt.secret=TestSecretKeyForJwtThatIsLongEnoughToWork2026SmartCampus
app.jwt.expiration=3600000

# OAuth2 test stubs (not used in unit/web tests)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# Frontend URL
app.frontend.url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
